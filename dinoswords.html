*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;flex-direction:column;align-items:center;min-height:100vh;
font-family:'Press Start 2P',monospace;overflow-x:hidden;user-select:none;color:#d8d5cc}
#wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:920px;padding:12px 8px 8px}
#header{text-align:center;margin-bottom:8px}
#header h1{font-size:clamp(14px,3.5vw,22px);color:#e8e4dc;letter-spacing:3px;margin-bottom:2px}

#gameBox{position:relative;width:100%;aspect-ratio:900/300;max-width:900px;
border:1px solid #1e1e30;background:#f7f7f7;overflow:hidden;border-radius:3px;

canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;right:0;display:flex;gap:16px;padding:10px 14px;z-index:10;pointer-events:none}
.sc{font-size:clamp(8px,1.2vw,11px);letter-spacing:1px;font-variant-numeric:tabular-nums}
#hi{color:#999}#sc{color:#535353}
#weaponName{position:absolute;top:10px;left:14px;font-size:clamp(7px,1vw,9px);color:#535353;
z-index:10;pointer-events:none;opacity:0;transition:opacity .3s}
#weaponName.show{opacity:1}
#kbWrap{width:100%;max-width:900px;margin-top:6px}
.kbRow{display:flex;justify-content:center;gap:3px;margin-bottom:3px}
.kbKey{width:clamp(24px,3.2vw,34px);height:clamp(24px,3.2vw,34px);background:#16161f;
border:1px solid #222;border-radius:3px;display:flex;flex-direction:column;align-items:center;
justify-content:center;cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.kbKey .kl{font-size:clamp(6px,.9vw,8px);color:#555;line-height:1}
.kbKey .ka{font-size:clamp(5px,.7vw,6px);color:#444;margin-top:1px;font-variant-numeric:tabular-nums}
.kbKey.owned{background:#1a1f1a;border-color:#2a3a2a}
.kbKey.owned .kl{color:#00e676}
.kbKey.owned .ka{color:#00a854}
.kbKey.empty{background:#1a1616;border-color:#2a2222}
.kbKey.empty .kl{color:#663333}
.kbKey.flash{background:#1a2a1a;border-color:#00e676;box-shadow:0 0 8px rgba(0,230,118,.3)}
.kbKey:active{transform:scale(.92)}
#mobileCtrl{display:none;width:100%;max-width:900px;margin-top:4px;gap:6px}
.mobBtn{flex:1;height:clamp(40px,8vw,56px);background:#16161f;border:1px solid #222;border-radius:4px;
display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:clamp(8px,1.6vw,11px);
color:#888;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mobBtn:active{background:#1a2a1a;border-color:#00e676;color:#00e676}
#startOverlay,#overOverlay{position:absolute;top:0;left:0;width:100%;height:100%;
display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#startOverlay{background:rgba(247,247,247,.97)}
#startOverlay h2{font-size:clamp(16px,4vw,28px);color:#535353;margin-bottom:4px}
#startOverlay .st{font-size:clamp(6px,1.2vw,8px);color:#999;margin-bottom:28px;letter-spacing:2px}
#startOverlay .inst{font-size:clamp(7px,1.1vw,9px);color:#777;text-align:center;line-height:2.4}
#startOverlay .go{font-size:clamp(7px,1.1vw,9px);color:#535353;margin-top:24px;animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#overOverlay{background:rgba(0,0,0,.82);backdrop-filter:blur(2px)}
#overOverlay.hidden{display:none}

#overOverlay h2{font-size:clamp(14px,3.5vw,24px);color:#ff5252;margin-bottom:6px}
#overOverlay .fs{font-size:clamp(9px,1.6vw,13px);color:#999;margin-bottom:24px}
#overOverlay button{font-family:inherit;font-size:clamp(7px,1.2vw,10px);color:#00e676;
padding:10px 24px;border:1px solid #00a854;background:transparent;border-radius:2px;cursor:pointer}

// build keyboard HUD
ROWS.forEach(row=>{
  const d=document.createElement('div');
  d.className='kbRow';
  row.forEach(k=>{
    const el=document.createElement('div');
    el.className='kbKey';
    el.dataset.key=k;
    el.innerHTML=`<span class="kl">${k}</span><span class="ka"></span>`;
    el.addEventListener('pointerdown',e=>{e.preventDefault();handleWeaponKey(k)});
    d.appendChild(el);
    keyEls[k]=el;
  });
  kbWrap.appendChild(d);
});

function updateKB(){
  for(const k in WPN){
    const el=keyEls[k];if(!el)continue;
    const have=inv[k];
    const ammoEl=el.querySelector('.ka');
    if(!have){
      el.className='kbKey';
      ammoEl.textContent='';
    }else if(have.uses<=0&&WPN[k].u!==Infinity){
      el.className='kbKey empty';
      ammoEl.textContent='0';
    }else{
      el.className='kbKey owned';
      ammoEl.textContent=WPN[k].u===Infinity?'∞':have.uses;
    }
  }
}

function flashKey(k){
  const el=keyEls[k];if(!el)return;
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),400);
}

function showWeaponName(k){
  const w=WPN[k];
  wnEl.textContent=`[${k}] ${w.n}`;
  wnEl.classList.add('show');
  clearTimeout(wnEl._t);
  wnEl._t=setTimeout(()=>wnEl.classList.remove('show'),1500);
}

function fmtScore(s){return String(Math.floor(s)).padStart(5,'0')}

// bitmap rendering helper — bmp is array of strings, each char '1' = filled pixel
function renderBitmap(bmp,bx,by,ps,color,flipX){
  X.fillStyle=color;
  const rows=bmp.length,cols=bmp[0].length;
  for(let r=0;r<rows;r++){
    const row=bmp[r];
    for(let c=0;c<cols;c++){
      if(row[c]==='1'){
        const px=flipX?bx+(cols-1-c)*ps:bx+c*ps;
        X.fillRect(px,by+r*ps,ps,ps);
      }
    }
  }
}

const PS=3; // pixel size for dino

function drawDino(){
  const x=dino.x,y=dino.y;
  const bodyCol=night?'#5a8a5a':'#3a7a3a';
  const bellyCol=night?'#7aaa7a':'#5a9a5a';
  const ec=night?'#111':'#fff';
  X.save();
  let color=bodyCol;
  if(dino.purpleTint>0){
    const t=dino.purpleTint/255;
    const r=Math.floor(0x3a*(1-t)+0xaa*t);
    const g=Math.floor(0x7a*(1-t)+0x33*t);
    const b=Math.floor(0x3a*(1-t)+0xcc*t);
    color=`rgb(${r},${g},${b})`;
  }
  if(dino.ducking){
    const bmp=DINO_DUCK;
    const bh=bmp.length*PS;
    renderBitmap(bmp,x-6,y-bh,PS,color);
    // belly highlight on duck
    X.fillStyle=dino.purpleTint>0?color:bellyCol;
    X.fillRect(x-6+4*PS,y-bh+4*PS,8*PS,PS);
    X.fillRect(x-6+4*PS,y-bh+5*PS,8*PS,PS);
  }else{
    let bmp;
    if(dino.dead){bmp=DINO_DEAD;}
    else if(dino.jumping||dino.y<GY){bmp=DINO_STAND;}
    else{bmp=(Math.floor(fr*0.15)%2===0)?DINO_RUN1:DINO_RUN2;}
    const bh=bmp.length*PS;
    renderBitmap(bmp,x-4,y-bh,PS,color);
    // belly highlight (rows 6-8, cols 1-5)
    if(dino.purpleTint<=0){
      X.fillStyle=bellyCol;
      for(let r=6;r<=8;r++){
        for(let c=1;c<=5;c++){
          if(bmp[r]&&bmp[r][c]==='1') X.fillRect(x-4+c*PS,y-bh+r*PS,PS,PS);
        }
      }
    }
    // eye
    if(!dino.dead){
      X.fillStyle=ec;
      X.fillRect(x-4+9*PS,y-bh+1*PS,PS,PS);
    }
    // hat (bat)
    if(dino.hatCap){
      X.fillStyle=night?'#aa4444':'#cc3333';
      X.fillRect(x+2,y-bh-4,30,4);
      X.fillRect(x+6,y-bh-8,22,4);
    }
  }
  X.restore();
}

function drawWeaponSprite(key,cx,cy,ps,fallback){
  const bmp=WEAPON_SPRITES[key];
  if(!bmp)return;
  const bw=bmp[0].length*ps,bh=bmp.length*ps;
  const cols=WPN_COLORS[key];
  const color=cols?(night?cols[1]:cols[0]):fallback;
  renderBitmap(bmp,cx-bw/2,cy-bh/2,ps,color);
}

function drawVehicle(){
  const x=dino.x,y=dino.y;
  if(vehicleMode==='heli'){
    const hb=night?'#5599bb':'#447799';
    const hd=night?'#3377aa':'#335577';
    // helicopter body
    X.fillStyle=hb;
    X.fillRect(x-10,y-15,60,18);
    X.fillStyle=hd;
    X.fillRect(x+40,y-12,16,10);
    // rotor
    X.fillStyle=night?'#aaa':'#666';
    const rAng=fr*0.5;
    X.fillRect(x-20+Math.cos(rAng)*25,y-20,50,3);
    X.fillRect(x+15,y-22,4,8);
    // skids
    X.fillStyle=night?'#888':'#555';
    X.fillRect(x-5,y+3,40,3);
    // tiny dino inside
    X.fillStyle=night?'#5a8a5a':'#3a7a3a';
    X.fillRect(x+5,y-10,12,10);
    X.fillRect(x+14,y-14,10,8);
    // windshield
    X.fillStyle=night?'rgba(100,200,255,0.3)':'rgba(80,180,240,0.4)';
    X.fillRect(x+20,y-13,12,8);
  }else{
    const tb=night?'#778877':'#556655';
    const td=night?'#667766':'#445544';
    // tank body
    X.fillStyle=tb;
    X.fillRect(x-15,y-20,65,18);
    // turret
    X.fillStyle=td;
    X.fillRect(x+5,y-30,25,12);
    // barrel
    X.fillStyle=night?'#889':'#667';
    X.fillRect(x+30,y-27,30,5);
    // treads
    X.fillStyle=night?'#555':'#333';
    X.fillRect(x-18,y-2,68,8);
    X.fillStyle=night?'#666':'#444';
    for(let i=0;i<6;i++){
      X.fillRect(x-16+i*11+((gOff*0.5)%11),y-1,6,6);
    }
    // tiny dino on top
    X.fillStyle=night?'#5a8a5a':'#3a7a3a';
    X.fillRect(x+10,y-36,10,8);
    X.fillRect(x+17,y-40,8,6);
  }
}

// obstacles
function spawnObs(){
  const types=['cs','ct','cg'];
  if(score>200)types.push('pt');
  if(score>200)types.push('pt');
  if(score>800&&Math.random()<0.05)types.push('gpt');
  const tp=types[Math.floor(Math.random()*types.length)];
  const o={tp,x:W+30,dead:false,parts:[]};
  switch(tp){
    case'cs':o.y=GY;o.w=17;o.h=33;break;
    case'ct':o.y=GY;o.w=20;o.h=50;break;
    case'cg':o.y=GY;o.w=48;o.h=38;break;
    case'pt':case'gpt':
      const heights=[GY-30,GY-65,GY-100];
      o.y=heights[Math.floor(Math.random()*3)];
      o.w=44;o.h=28;o.wf=0;break;
  }
  obs.push(o);
}

function drawObs(o){
  if(o.dead)return;
  const x=o.x,y=o.y;
  // cactus colors
  const cactMain=night?'#4a9a4a':'#2a7a2a';
  const cactDark=night?'#3a8a3a':'#1a6a1a';
  const cactHigh=night?'#5aaa5a':'#3a9a3a';
  // ptero colors
  const ptCol=night?'#b8956a':'#8a6842';
  const ptWing=night?'#a07850':'#7a5535';
  const goldCol='#DAA520';
  const goldWing='#c49418';

  if(o.tp==='cs'){
    X.fillStyle=cactMain;
    X.fillRect(x,y-33,17,33);
    X.fillStyle=cactDark;
    X.fillRect(x-7,y-23,9,5);X.fillRect(x+15,y-16,9,5);
    X.fillRect(x-7,y-23,5,13);X.fillRect(x+19,y-16,5,11);
    // highlight stripe
    X.fillStyle=cactHigh;
    X.fillRect(x+6,y-30,3,24);
  }else if(o.tp==='ct'){
    X.fillStyle=cactMain;
    X.fillRect(x,y-50,20,50);
    X.fillStyle=cactDark;
    X.fillRect(x-9,y-38,11,5);X.fillRect(x+18,y-28,11,5);
    X.fillRect(x-9,y-38,5,18);X.fillRect(x+24,y-28,5,16);
    X.fillStyle=cactHigh;
    X.fillRect(x+8,y-46,3,40);
  }else if(o.tp==='cg'){
    X.fillStyle=cactMain;
    X.fillRect(x,y-33,15,33);
    X.fillRect(x+16,y-38,15,38);
    X.fillRect(x+32,y-28,15,28);
    X.fillStyle=cactDark;
    X.fillRect(x-5,y-20,7,4);X.fillRect(x-5,y-20,4,10);
    X.fillRect(x+40,y-18,7,4);X.fillRect(x+43,y-18,4,9);
    X.fillStyle=cactHigh;
    X.fillRect(x+6,y-30,2,24);
    X.fillRect(x+23,y-34,2,28);
    X.fillRect(x+38,y-24,2,18);
  }else{
    // pterodactyl
    const isGold=o.tp==='gpt';
    const bodyC=isGold?goldCol:ptCol;
    const wingC=isGold?goldWing:ptWing;
    X.fillStyle=bodyC;
    X.fillRect(x+4,y-4,28,9);
    // beak
    X.fillStyle=isGold?'#eebb33':night?'#cc9955':'#aa7733';
    X.fillRect(x+32,y-2,10,5);
    // eye
    X.fillStyle=night?'#111':'#fff';
    X.fillRect(x+28,y-2,3,3);
    // wings
    X.fillStyle=wingC;
    o.wf=(o.wf||0)+0.12;
    const wy=Math.sin(o.wf*3)*9;
    X.beginPath();X.moveTo(x+8,y);X.lineTo(x,y-14+wy);X.lineTo(x+18,y);X.fill();
    X.beginPath();X.moveTo(x+12,y+4);X.lineTo(x+4,y+13-wy*.5);X.lineTo(x+22,y+4);X.fill();
    if(isGold){
      X.fillStyle='rgba(255,215,0,0.15)';
      X.beginPath();X.arc(x+20,y,22,0,Math.PI*2);X.fill();
    }
  }
}

function deadPartColor(tp){
  if(tp==='gpt')return'#DAA520';
  if(tp==='pt')return night?'#b8956a':'#8a6842';
  if(tp==='cs'||tp==='ct'||tp==='cg')return night?'#4a9a4a':'#2a7a2a';
  return night?'#aaa':'#535353';
}

function drawDeadParts(){
  for(const o of obs){
    if(!o.dead)continue;
    for(const p of o.parts){
      X.save();X.translate(p.x,p.y);X.rotate(p.rot);X.globalAlpha=p.a;
      X.fillStyle=deadPartColor(o.tp);
      X.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      X.restore();
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;p.rot+=p.vr;p.a-=0.018;
    }
    o.parts=o.parts.filter(p=>p.a>0);
  }
}

function killObs(o,fromX){
  if(o.dead)return;
  o.dead=true;
  const cx=o.x+o.w/2,cy=(o.tp==='pt'||o.tp==='gpt')?o.y:o.y-o.h/2;
  for(let i=0;i<8;i++){
    o.parts.push({x:cx+(Math.random()-.5)*o.w,y:cy+(Math.random()-.5)*o.h,
      w:4+Math.random()*12,h:4+Math.random()*12,
      vx:(Math.random()-.5)*8+(fromX?2:0),vy:-2-Math.random()*6,
      rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,a:1});
  }
  spawnParts(cx,cy,10,night?'#ff8':'#ff0');
  score+=25;
  shake=Math.max(shake,5);
}

// pickups
function spawnPickup(){
  const avail=Object.keys(WPN).filter(k=>!inv[k]);
  if(!avail.length)return;
  const k=avail[Math.floor(Math.random()*avail.length)];
  pickups.push({k,x:W+30,y:GY-20-Math.random()*60,bob:Math.random()*6.28});
}

const TYPE_GLOW={
  melee:'rgba(170,176,184,',proj:'rgba(200,160,40,',beam:'rgba(240,120,40,',
  expl:'rgba(200,80,40,',spec:'rgba(60,140,220,',veh:'rgba(70,120,160,',
  pow:'rgba(100,60,180,',cosm:'rgba(200,60,80,',danger:'rgba(200,60,60,',
};

function drawPickups(){
  for(const p of pickups){
    p.bob+=0.06;
    const by=Math.sin(p.bob)*5;
    const cx=p.x+10,cy=p.y+by;
    X.save();
    // colored glow circle based on weapon type
    const wt=WPN[p.k].t;
    const glowBase=TYPE_GLOW[wt]||'rgba(130,130,130,';
    X.fillStyle=glowBase+(night?'0.12':'0.1')+')';
    X.beginPath();X.arc(cx,cy,18,0,Math.PI*2);X.fill();
    // outer ring pulse
    X.strokeStyle=glowBase+(night?'0.2':'0.15')+')';
    X.lineWidth=1;
    const pulse=16+Math.sin(p.bob*1.5)*3;
    X.beginPath();X.arc(cx,cy,pulse,0,Math.PI*2);X.stroke();
    // weapon sprite (uses its own color)
    drawWeaponSprite(p.k,cx,cy-2,3,night?'#c8c8c8':'#535353');
    // small key label below
    const cols=WPN_COLORS[p.k];
    X.fillStyle=cols?(night?cols[1]:cols[0]):(night?'#c8c8c8':'#535353');
    X.font='bold 7px "Press Start 2P",monospace';
    X.textAlign='center';X.textBaseline='top';
    X.fillText(p.k,cx,cy+12);
    X.restore();
  }
}

// particles
function spawnParts(x,y,n,col){
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*8,
    sz:2+Math.random()*4,a:1,c:col||'#ff0'});
}

function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.a-=0.025;
    if(p.a<=0)parts.splice(i,1);
  }
}

function drawParts(){
  for(const p of parts){
    X.save();X.globalAlpha=p.a;X.fillStyle=p.c;
    X.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);X.restore();
  }
}

// effects (text popups, beams, etc)
function addEffect(type,data){effects.push({type,fr:0,...data})}

function drawEffects(){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.fr++;
    X.save();
    if(e.type==='text'){
      X.globalAlpha=Math.max(0,1-e.fr/50);
      X.fillStyle=e.c||'#535353';
      X.font=(e.big?'bold 14px':'bold 10px')+' "Press Start 2P",monospace';
      X.textAlign='center';
      X.fillText(e.txt,e.x,e.y-e.fr*0.8);
    }else if(e.type==='beam'){
      X.globalAlpha=Math.max(0,1-e.fr/12);
      X.strokeStyle=e.c||'#f80';X.lineWidth=e.w||4;
      X.beginPath();X.moveTo(e.x1,e.y1);X.lineTo(e.x2,e.y2);X.stroke();
      if(e.glow){X.shadowColor=e.c;X.shadowBlur=12;
        X.beginPath();X.moveTo(e.x1,e.y1);X.lineTo(e.x2,e.y2);X.stroke();}
    }else if(e.type==='explosion'){
      const r=e.fr*3;
      X.globalAlpha=Math.max(0,1-e.fr/20);
      X.fillStyle='#f80';X.beginPath();X.arc(e.x,e.y,r,0,Math.PI*2);X.fill();
      X.fillStyle='#ff0';X.beginPath();X.arc(e.x,e.y,r*.6,0,Math.PI*2);X.fill();
    }else if(e.type==='portal'){
      X.globalAlpha=Math.max(0,1-e.fr/30);
      X.strokeStyle='#39f';X.lineWidth=3;
      X.beginPath();X.ellipse(e.x1,e.y,8,18,0,0,Math.PI*2);X.stroke();
      X.strokeStyle='#f80';
      X.beginPath();X.ellipse(e.x2,e.y,8,18,0,0,Math.PI*2);X.stroke();
    }else if(e.type==='meteor'){
      if(e.fr<20){
        const mx=e.tx-(20-e.fr)*15,my=e.ty-(20-e.fr)*15;
        X.fillStyle='#a44';X.beginPath();X.arc(mx,my,14,0,Math.PI*2);X.fill();
        X.fillStyle='#f80';X.beginPath();X.arc(mx,my,8,0,Math.PI*2);X.fill();
      }else{
        const r=(e.fr-20)*5;
        X.globalAlpha=Math.max(0,1-(e.fr-20)/20);
        X.fillStyle='#f80';X.beginPath();X.arc(e.tx,e.ty,r,0,Math.PI*2);X.fill();
        X.fillStyle='#ff0';X.beginPath();X.arc(e.tx,e.ty,r*.5,0,Math.PI*2);X.fill();
      }
      if(e.fr===20){
        shake=12;
        obs.forEach(o=>{if(!o.dead&&Math.abs(o.x-e.tx)<200)killObs(o,true)});
      }
    }else if(e.type==='plane'){
      const px=W+50-e.fr*6;
      X.fillStyle=night?'#aaa':'#535353';
      X.fillRect(px,30,40,12);X.fillRect(px+30,26,14,8);
      X.fillRect(px+5,24,20,6);
      // gas
      if(e.fr>15&&e.fr<60){
        X.globalAlpha=0.4;X.fillStyle='#4a4';
        for(let g=0;g<5;g++){
          const gx=px+10+g*8+(Math.random()-.5)*10;
          const gy=42+(e.fr-15)*3+g*6;
          X.beginPath();X.arc(gx,gy,6+Math.random()*4,0,Math.PI*2);X.fill();
        }
        X.globalAlpha=1;
        if(e.fr%5===0){
          obs.forEach(o=>{if(!o.dead&&o.x>px-20&&o.x<px+60)killObs(o,false)});
        }
      }
    }else if(e.type==='scream'){
      X.globalAlpha=Math.max(0,1-e.fr/40);
      X.fillStyle=night?'#c8c8c8':'#535353';
      X.font='bold 12px "Press Start 2P",monospace';
      X.fillText('AHHH!!!',dino.x+50,dino.y-50-e.fr*0.5);
    }else if(e.type==='respect'){
      X.globalAlpha=Math.max(0,1-e.fr/40);
      X.fillStyle=night?'#c8c8c8':'#535353';
      X.font='16px "Press Start 2P",monospace';
      X.fillText('F',dino.x+50,dino.y-35);
    }
    X.restore();
    if(e.type==='text'&&e.fr>50)effects.splice(i,1);
    else if(e.type==='beam'&&e.fr>12)effects.splice(i,1);
    else if(e.type==='explosion'&&e.fr>20)effects.splice(i,1);
    else if(e.type==='portal'&&e.fr>30)effects.splice(i,1);
    else if(e.type==='meteor'&&e.fr>40)effects.splice(i,1);
    else if(e.type==='plane'&&e.fr>80)effects.splice(i,1);
    else if(e.type==='scream'&&e.fr>40)effects.splice(i,1);
    else if(e.type==='respect'&&e.fr>40)effects.splice(i,1);
  }
}

// projectiles
function drawProjs(){
  for(const p of projs){
    X.save();X.fillStyle=p.c||(night?'#c8c8c8':'#535353');
    if(p.shape==='star'){
      X.translate(p.x,p.y);X.rotate(fr*0.3);
      for(let i=0;i<4;i++){X.rotate(Math.PI/2);X.fillRect(-1,-6,2,12);}
    }else if(p.shape==='arrow'){
      X.fillRect(p.x,p.y-1,16,2);
      X.beginPath();X.moveTo(p.x+16,p.y-4);X.lineTo(p.x+22,p.y);X.lineTo(p.x+16,p.y+4);X.fill();
    }else if(p.shape==='sandal'){
      X.fillRect(p.x,p.y-3,10,6);X.fillRect(p.x+2,p.y-6,2,3);
    }else if(p.shape==='grenade'){
      X.beginPath();X.arc(p.x,p.y,5,0,Math.PI*2);X.fill();
    }else if(p.shape==='portal'){
      X.fillStyle='#39f';X.beginPath();X.arc(p.x,p.y,4,0,Math.PI*2);X.fill();
    }else{
      X.fillRect(p.x,p.y-2,8,4);
    }
    X.restore();
  }
}

function updateProjs(){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    p.x+=p.vx;
    if(p.vy!==undefined)p.y+=p.vy;
    if(p.arc)p.vy+=p.arc;
    // collision with obstacles
    for(const o of obs){
      if(o.dead)continue;
      const ox=o.x,oy=(o.tp==='pt'||o.tp==='gpt')?o.y-o.h/2:o.y-o.h;
      if(p.x>ox&&p.x<ox+o.w&&p.y>oy&&p.y<oy+o.h){
        if(p.shape==='grenade'){
          addEffect('explosion',{x:p.x,y:p.y});
          obs.forEach(o2=>{if(!o2.dead&&Math.abs(o2.x-p.x)<80)killObs(o2,true)});
        }else if(p.shape==='portal'){
          addEffect('portal',{x1:ox-10,x2:ox+o.w+30,y:o.y-(o.h/2)});
          killObs(o,false);
        }else{
          killObs(o,true);
        }
        projs.splice(i,1);
        return;
      }
    }
    if(p.x>W+20||p.x<-20||p.y>H+20)projs.splice(i,1);
  }
}

// weapon activation
function handleWeaponKey(k){
  if(st!=='playing')return;
  if(!inv[k])return;
  const w=WPN[k];
  if(w.u!==Infinity&&inv[k].uses<=0)return;

  if(w.u!==Infinity)inv[k].uses--;
  showWeaponName(k);
  flashKey(k);
  updateKB();

  const dx=dino.x+30,dy=vehicleMode?dino.y-10:dino.ducking?dino.y-10:dino.y-25;

  if(w.t==='melee'){
    swingTimer=12;swingKey=k;
    const range=w.r||55;
    obs.forEach(o=>{
      if(!o.dead){
        const ox=o.x+o.w/2;
        const oy=(o.tp==='pt'||o.tp==='gpt')?o.y:o.y-o.h/2;
        const dist=Math.hypot(ox-dx,oy-dy);
        if(dist<range+20)killObs(o,true);
      }
    });
    if(k==='V')dino.hatCap=true;
  }else if(w.t==='proj'){
    const vy=w.arc?(typeof w.arc==='number'?-w.arc*8:-3):0;
    const arcVal=w.arc?(typeof w.arc==='number'?w.arc*0.15:0.15):0;
    let shape='bullet',pc;
    if(k==='T'){shape='star';pc=night?'#aab':'#889';}
    else if(k==='B'){shape='arrow';pc=night?'#aa7744':'#885522';}
    else if(k==='E'){shape='sandal';pc=night?'#e6a060':'#d4894a';}
    else if(k==='W'){pc=night?'#ccaa22':'#aa8800';}
    else if(k==='S'){pc=night?'#ccaa22':'#aa8800';}
    else{pc=night?'#c8c8c8':'#535353';}
    projs.push({x:dx,y:dy,vx:w.sp||14,vy,arc:arcVal||0,
      c:pc,shape});
  }else if(w.t==='beam'){
    const range=w.r||80;
    if(k==='X'){
      addEffect('beam',{x1:dx,y1:dy,x2:dx+range,y2:dy,c:'#f44',w:3,glow:true});
    }else if(k==='R'){
      addEffect('beam',{x1:dx,y1:dy-5,x2:dx+range,y2:dy+5,c:'#f80',w:8});
      spawnParts(dx+range/2,dy,6,'#f80');
    }else{
      addEffect('beam',{x1:dx,y1:dy,x2:dx+range,y2:dy,c:'#48f',w:4});
    }
    obs.forEach(o=>{
      if(!o.dead&&o.x>dx-10&&o.x<dx+range+o.w){
        const oy=(o.tp==='pt'||o.tp==='gpt')?o.y:o.y-o.h/2;
        if(Math.abs(oy-dy)<40)killObs(o,true);
      }
    });
  }else if(w.t==='expl'){
    if(k==='J'){
      projs.push({x:dx,y:dy,vx:10,vy:-6,arc:0.3,c:night?'#778844':'#556633',shape:'grenade'});
    }else if(k==='Z'){
      const tx=dino.x+200+Math.random()*200;
      addEffect('meteor',{tx,ty:GY});
    }
  }else if(w.t==='spec'){
    if(k==='H'){
      projs.push({x:dx,y:dy,vx:14,vy:0,c:'#39f',shape:'portal'});
    }else if(k==='C'){
      addEffect('plane',{});
    }
  }else if(w.t==='veh'){
    if(!vehicleMode){
      vehicleMode=k==='I'?'heli':'tank';
      vehicleTimer=w.dur;
    }
  }else if(w.t==='pow'){
    if(w.eff==='slow'){spdMod=0.5;spdModTimer=300;addEffect('text',{x:dino.x+40,y:dino.y-50,txt:'SLOW',c:'#48f',big:true})}
    else{spdMod=1.8;spdModTimer=200;addEffect('text',{x:dino.x+40,y:dino.y-50,txt:'FAST!',c:'#f44',big:true})}
  }else if(w.t==='cosm'){
    if(k==='Y')addEffect('scream',{});
    else addEffect('respect',{});
  }else if(w.t==='danger'){
    if(k==='A'){
      cigUses++;
      dino.purpleTint=Math.min(255,(cigUses/11)*255);
      obs.forEach(o=>{
        if(!o.dead){
          const d=Math.hypot(o.x+o.w/2-dx,(o.tp==='pt'?o.y:o.y-o.h/2)-dy);
          if(d<60)killObs(o,false);
        }
      });
      spawnParts(dx+10,dy-5,4,'#888');
      if(cigUses>=11){
        deathReason='Lung cancer';
        killDino();
      }
    }else if(k==='D'){
      if(Math.random()<0.5){
        obs.forEach(o=>{
          if(!o.dead){
            const d=Math.hypot(o.x+o.w/2-dx,(o.tp==='pt'?o.y:o.y-o.h/2)-dy);
            if(d<80)killObs(o,true);
          }
        });
        swingTimer=12;swingKey=k;
      }else{
        deathReason='Double-edged sword';
        killDino();
      }
    }
  }
}

function killDino(){
  dino.dead=true;
  st='gameover';
  overOv.classList.remove('hidden');
  fsEl.textContent=fmtScore(score);
  spawnParts(dino.x+15,dino.y-20,20,'#f44');
  shake=10;
}

// collision
function hitboxDino(){
  if(vehicleMode==='heli')return{x:dino.x-5,y:dino.y-12,w:55,h:20};
  if(vehicleMode==='tank')return{x:dino.x-15,y:dino.y-28,w:65,h:28};
  if(dino.ducking)return{x:dino.x-6,y:dino.y-27,w:45,h:27};
  return{x:dino.x-4,y:dino.y-42,w:36,h:42};
}

function checkCol(){
  if(vehicleMode==='tank')return;
  const hb=hitboxDino();
  for(const o of obs){
    if(o.dead)continue;
    const ox=o.x+3,ow=o.w-6;
    const oy=(o.tp==='pt'||o.tp==='gpt')?o.y-o.h/2+3:o.y-o.h+3;
    const oh=o.h-6;
    if(hb.x<ox+ow&&hb.x+hb.w>ox&&hb.y<oy+oh&&hb.y+hb.h>oy){
      if(vehicleMode==='heli'){killObs(o,true);continue;}
      deathReason='';
      killDino();
      return;
    }
  }
}

// ground & environment
function drawGround(){
  X.fillStyle=night?'#998866':'#776644';
  X.fillRect(0,GY,W,1);
  X.fillStyle=night?'#665533':'#ccbb99';
  for(let i=0;i<W+20;i+=26){
    const xp=((i-gOff%26)+W)%W;
    X.fillRect(xp,GY+7,13,1);
    X.fillRect(xp+5,GY+14,9,1);
  }
  // sparse ground detail
  X.fillStyle=night?'#554422':'#ddccaa';
  for(let i=0;i<W+40;i+=73){
    const xp=((i-gOff%73)+W+40)%(W+40)-20;
    X.fillRect(xp,GY+3,2,2);
    X.fillRect(xp+30,GY+5,3,1);
  }
}

function drawClouds(){
  for(const c of clouds){
    X.fillStyle=night?'#334455':'#ccdde8';
    X.fillRect(c.x,c.y,44,13);
    X.fillRect(c.x+9,c.y-7,24,9);
    X.fillRect(c.x+4,c.y+11,18,5);
    // highlight
    X.fillStyle=night?'#3a5566':'#ddeaf2';
    X.fillRect(c.x+9,c.y-5,20,4);
  }
}

function drawStars(){
  if(!night)return;
  const starCols=['#eeeedd','#ddddff','#ffeedd','#ddeeff'];
  for(let i=0;i<25;i++){
    const sx=(i*131+fr*0.08)%W,sy=(i*89)%(GY-40);
    X.globalAlpha=0.25+Math.sin(fr*0.04+i)*0.25;
    X.fillStyle=starCols[i%4];
    X.fillRect(sx,sy,(i%3)+1,(i%3)+1);
  }
  X.globalAlpha=1;
}

function drawMoon(){
  if(!night)return;
  // outer glow
  X.fillStyle='rgba(230,220,180,0.06)';
  X.beginPath();X.arc(740,45,34,0,Math.PI*2);X.fill();
  // moon body
  X.fillStyle='#eee8cc';X.beginPath();X.arc(740,45,22,0,Math.PI*2);X.fill();
  // crater shadow
  X.fillStyle='#1a1a1a';
  X.beginPath();X.arc(748,40,17,0,Math.PI*2);X.fill();
  // subtle craters
  X.fillStyle='#ddd4b8';
  X.beginPath();X.arc(732,42,3,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(738,52,2,0,Math.PI*2);X.fill();
}

function drawSwing(){
  if(swingTimer<=0)return;
  const dx=dino.x+30,dy=vehicleMode?dino.y-10:dino.ducking?dino.y-10:dino.y-25;
  const prog=1-swingTimer/12;
  const angle=-Math.PI*0.6+prog*Math.PI*1.2;
  const len=WPN[swingKey]?WPN[swingKey].r||55:55;
  const tx=dx+Math.cos(angle)*len,ty=dy+Math.sin(angle)*len;
  const sc=WPN_COLORS[swingKey];
  const bladeCol=sc?(night?sc[1]:sc[0]):(night?'#c8c8c8':'#535353');
  X.save();X.strokeStyle=bladeCol;X.lineWidth=3;X.lineCap='round';
  X.beginPath();X.moveTo(dx,dy);X.lineTo(tx,ty);X.stroke();
  // swing trail
  X.globalAlpha=0.25;X.strokeStyle=bladeCol;X.lineWidth=6;
  X.beginPath();X.arc(dx,dy,len,-Math.PI*0.6,-Math.PI*0.6+prog*Math.PI*1.2);X.stroke();
  X.restore();
}

// score milestone flash
function drawScoreFlash(){
  if(scoreFlash>0){
    X.save();X.globalAlpha=scoreFlash/20;
    X.fillStyle=night?'#c8c8c8':'#535353';
    X.fillRect(0,0,W,H);
    X.restore();
    scoreFlash--;
  }
}

// tank auto-kill
function tankAutoKill(){
  if(vehicleMode!=='tank')return;
  obs.forEach(o=>{
    if(!o.dead&&o.x<dino.x+50&&o.x>dino.x-20){
      const oy=(o.tp==='pt'||o.tp==='gpt')?o.y:o.y-o.h;
      if(oy+o.h>GY-35)killObs(o,true);
    }
  });
}

// main update
let pickupTimer=0;
function update(){
  if(st!=='playing')return;
  fr++;

  const effSpd=baseSpd*spdMod;
  spd=effSpd;
  score+=spd*0.05;
  baseSpd=6+Math.floor(score/100)*0.4;
  if(baseSpd>14)baseSpd=14;

  if(spdModTimer>0){spdModTimer--;if(spdModTimer<=0)spdMod=1;}

  night=Math.floor(score/700)%2===1;
  gOff+=spd;

  // milestone flash
  const ms=Math.floor(score/100);
  if(ms>lastMilestone){lastMilestone=ms;scoreFlash=15;}

  scEl.textContent=fmtScore(score);
  scEl.style.color=night?'#c8c8c8':'#535353';
  hiEl.style.color=night?'#888':'#999';
  if(score>hiScore){hiScore=score;hiEl.textContent='HI '+fmtScore(hiScore)}

  // dino physics
  if(vehicleMode){
    vehicleTimer--;
    if(vehicleTimer<=0){vehicleMode=null;dino.y=GY;}
    if(vehicleMode==='heli'){
      // float at mouse-ish height or auto
      const targetY=Math.min(GY-40,Math.max(40,GY-100));
      dino.y+=(targetY-dino.y)*0.05;
      if(keysDown['ArrowUp']||keysDown[' '])dino.y=Math.max(30,dino.y-3);
      if(keysDown['ArrowDown'])dino.y=Math.min(GY-30,dino.y+3);
      // auto shoot
      if(fr%15===0){
        projs.push({x:dino.x+40,y:dino.y+8,vx:16,vy:2,c:night?'#ccaa22':'#aa8800',shape:'bullet'});
      }
    }else{
      dino.y=GY;
      tankAutoKill();
      if(fr%20===0){
        projs.push({x:dino.x+60,y:dino.y-25,vx:18,vy:0,c:night?'#ccaa22':'#aa8800',shape:'bullet'});
      }
    }
  }else{
    if(dino.jumping||dino.y<GY){
      dino.vy+=0.55;
      if(dino.jumpHeld&&dino.vy<0)dino.vy-=0.15;
      dino.y+=dino.vy;
      if(dino.y>=GY){dino.y=GY;dino.vy=0;dino.jumping=false;}
    }
  }

  // clouds
  for(const c of clouds)c.x-=spd*0.25;
  clouds=clouds.filter(c=>c.x>-60);
  if(Math.random()<0.004)clouds.push({x:W+20,y:30+Math.random()*80});

  // obstacles
  obsTimer++;
  const minInt=Math.max(30,50-Math.floor(score/200)*2);
  if(obsTimer>minInt+Math.random()*50){spawnObs();obsTimer=0;}

  for(const o of obs){
    if(!o.dead)o.x-=spd;
    else for(const p of o.parts)p.x-=spd*0.2;
  }

  // remove offscreen
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    if(o.dead&&o.parts.length===0){obs.splice(i,1);continue;}
    if(o.x<-100&&!o.dead){obs.splice(i,1);continue;}
    if(o.x<-200){obs.splice(i,1);}
  }

  // pickups
  pickupTimer++;
  if(pickupTimer>120+Math.random()*100){spawnPickup();pickupTimer=0;}
  for(const p of pickups)p.x-=spd;
  // collect
  const hb=hitboxDino();
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    if(p.x<hb.x+hb.w&&p.x+20>hb.x&&p.y-12<hb.y+hb.h&&p.y+8>hb.y){
      inv[p.k]={uses:WPN[p.k].u===Infinity?Infinity:WPN[p.k].u};
      showWeaponName(p.k);
      flashKey(p.k);
      updateKB();
      addEffect('text',{x:p.x,y:p.y-20,txt:'['+p.k+'] '+WPN[p.k].n,c:night?'#c8c8c8':'#535353'});
      pickups.splice(i,1);
      continue;
    }
    if(p.x<-30)pickups.splice(i,1);
  }

  // swing timer
  if(swingTimer>0)swingTimer--;

  // projectiles
  updateProjs();
  updateParts();
  checkCol();
  if(shake>0)shake-=0.4;
}

function draw(){
  X.save();
  if(shake>0)X.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);

  if(night){
    // night sky gradient
    const ng=X.createLinearGradient(0,0,0,H);
    ng.addColorStop(0,'#0a0a1a');
    ng.addColorStop(0.6,'#141428');
    ng.addColorStop(1,'#1a1a2a');
    X.fillStyle=ng;
  }else{
    // day sky gradient
    const dg=X.createLinearGradient(0,0,0,H);
    dg.addColorStop(0,'#c8e0f8');
    dg.addColorStop(0.5,'#e4eff8');
    dg.addColorStop(1,'#f5f5f0');
    X.fillStyle=dg;
  }
  X.fillRect(0,0,W,H);

  drawStars();drawMoon();drawClouds();drawGround();
  drawPickups();
  for(const o of obs)drawObs(o);
  drawDeadParts();

  if(vehicleMode)drawVehicle();
  else drawDino();

  drawSwing();
  drawProjs();
  drawEffects();
  drawParts();
  drawScoreFlash();

  X.restore();
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function resetGame(){
  score=0;baseSpd=6;spd=6;fr=0;gOff=0;obsTimer=0;night=false;shake=0;
  spdMod=1;spdModTimer=0;scoreFlash=0;lastMilestone=0;
  obs.length=0;projs.length=0;parts.length=0;effects.length=0;pickups.length=0;
  clouds.length=0;
  inv={};cigUses=0;vehicleMode=null;vehicleTimer=0;
  swingTimer=0;dino.y=GY;dino.vy=0;dino.jumping=false;dino.ducking=false;
  dino.dead=false;dino.jumpHeld=false;dino.hatCap=false;dino.purpleTint=0;
  pickupTimer=0;deathReason='';
  updateKB();
  for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*80});
}

function startGame(){
  resetGame();
  st='playing';
  startOv.classList.add('hidden');
  overOv.classList.add('hidden');
}

// input
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  keysDown[e.key]=true;
  if(st==='start'&&(e.key===' '||e.key==='ArrowUp')){e.preventDefault();startGame();return;}
  if(st==='gameover'&&(e.key===' '||e.key==='Enter')){e.preventDefault();startGame();return;}
  if(st!=='playing')return;

  if(e.key===' '||e.key==='ArrowUp'){
    e.preventDefault();
    if(!vehicleMode&&dino.y>=GY&&!dino.jumping){
      dino.jumping=true;dino.vy=-10.5;dino.jumpHeld=true;dino.ducking=false;
    }
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(!vehicleMode){dino.ducking=true;}
  }else{
    const k=e.key.toUpperCase();
    if(WPN[k])handleWeaponKey(k);
  }
});

document.addEventListener('keyup',e=>{
  keysDown[e.key]=false;
  if(e.key===' '||e.key==='ArrowUp'){dino.jumpHeld=false;}
  if(e.key==='ArrowDown'){dino.ducking=false;}
});

// mobile
const mbJ=document.getElementById('mbJump');
const mbD=document.getElementById('mbDuck');
mbJ.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(st==='start'){startGame();return;}
  if(st==='gameover'){startGame();return;}
  if(st==='playing'&&!vehicleMode&&dino.y>=GY&&!dino.jumping){
    dino.jumping=true;dino.vy=-10.5;dino.jumpHeld=true;dino.ducking=false;
  }
});
mbJ.addEventListener('pointerup',()=>{dino.jumpHeld=false;});
mbD.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(st==='start'){startGame();return;}
  if(st==='gameover'){startGame();return;}
  if(!vehicleMode)dino.ducking=true;
});
mbD.addEventListener('pointerup',()=>{dino.ducking=false;});
mbD.addEventListener('pointerleave',()=>{dino.ducking=false;});

// touch on canvas for jump
const gameBox=document.getElementById('gameBox');
gameBox.addEventListener('touchstart',e=>{
  if(st==='start'){e.preventDefault();startGame();return;}
  if(st==='gameover'){e.preventDefault();startGame();return;}
},{passive:false});

document.getElementById('retry').addEventListener('click',startGame);
startOv.addEventListener('click',()=>{if(st==='start')startGame()});

// init
for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*80});
updateKB();
gameLoop();
</script>
</body>
</html>
